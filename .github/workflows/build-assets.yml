name: Build Assets

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install packages
        run: npm install

      - name: Build Vite assets
        run: npm run build

      - name: Upload build folder
        uses: actions/upload-artifact@v4
        with:
          name: public-build
          path: public/build
